name: Desktop

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            tauri_triple: x86_64-unknown-linux-gnu
            ollama_url: https://github.com/ollama/ollama/releases/latest/download/ollama-linux-amd64.tar.zst

          - platform: macos-aarch64
            os: macos-latest
            tauri_triple: aarch64-apple-darwin
            ollama_url: https://github.com/ollama/ollama/releases/latest/download/ollama-darwin.tgz

          - platform: windows-x86_64
            os: windows-latest
            tauri_triple: x86_64-pc-windows-msvc
            ollama_url: https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            NEW_VERSION="${TAG#v}"
          else
            COMMITS=$(git rev-list --count HEAD)
            NEW_VERSION="0.1.${COMMITS}"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "Bumping version to $NEW_VERSION"
          for f in Cargo.toml vinrouge-desktop/Cargo.toml vinrouge-web/Cargo.toml vinrouge-worker/Cargo.toml; do
            sed -i.bak "s/^version = \".*\"/version = \"$NEW_VERSION\"/" "$f"
            rm -f "$f.bak"
          done

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vinrouge-desktop -> target

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "v0.21.7"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Download Ollama binary (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p vinrouge-desktop/binaries
          curl -L --fail "${{ matrix.ollama_url }}" -o ollama.tar.zst
          tar --zstd -xf ollama.tar.zst
          find . -path ./vinrouge-desktop -prune -o -name "ollama" -type f -print | head -1 \
            | xargs -I{} cp {} vinrouge-desktop/binaries/ollama-${{ matrix.tauri_triple }}
          chmod +x vinrouge-desktop/binaries/ollama-${{ matrix.tauri_triple }}

      - name: Download Ollama binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p vinrouge-desktop/binaries
          curl -L --fail "${{ matrix.ollama_url }}" -o ollama.tgz
          tar -xzf ollama.tgz
          find . -path ./vinrouge-desktop -prune -o -name "ollama" -type f -print | head -1 \
            | xargs -I{} cp {} vinrouge-desktop/binaries/ollama-${{ matrix.tauri_triple }}
          chmod +x vinrouge-desktop/binaries/ollama-${{ matrix.tauri_triple }}

      - name: Download Ollama binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "vinrouge-desktop\binaries"
          curl.exe -L --fail "${{ matrix.ollama_url }}" -o ollama.zip
          Expand-Archive -Path ollama.zip -DestinationPath tmp_ollama -Force
          $bin = Get-ChildItem -Path tmp_ollama -Filter "ollama.exe" -Recurse | Select-Object -First 1
          Copy-Item $bin.FullName "vinrouge-desktop\binaries\ollama-${{ matrix.tauri_triple }}.exe"
          $ollamaLib = Join-Path $bin.DirectoryName "lib\ollama"
          if (Test-Path $ollamaLib) {
            $dest = "vinrouge-desktop\binaries\lib\ollama"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Get-ChildItem -Path $ollamaLib -Filter "*.dll" |
              ForEach-Object { Copy-Item $_.FullName $dest }
            $cudaDir = Join-Path $ollamaLib "cuda_v12"
            if (Test-Path $cudaDir) {
              Copy-Item -Recurse -Force $cudaDir "$dest\cuda_v12"
            } else {
              Write-Warning "cuda_v12 runner not found — GPU inference will fall back to CPU"
            }
          } else {
            Write-Warning "lib\ollama not found in Ollama archive"
          }

      - name: Build Leptos frontend
        working-directory: vinrouge-web
        run: trunk build --release --public-url ./

      - name: Generate app icons
        working-directory: vinrouge-desktop
        run: cargo tauri icon icons/icon.png

      - name: Build desktop app (macOS / Linux)
        if: matrix.os != 'windows-latest'
        working-directory: vinrouge-desktop
        run: cargo tauri build

      - name: Build desktop app (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: vinrouge-desktop
        run: cargo tauri build --no-bundle

      - name: Build CLI binary
        run: cargo build --release --bin vinrouge

      - name: Package CLI binary (macOS / Linux)
        if: matrix.os != 'windows-latest'
        run: |
          ARCHIVE="vinrouge-${{ matrix.tauri_triple }}.tar.gz"
          tar czf "$ARCHIVE" -C target/release vinrouge
          echo "CLI archive: $ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Package CLI binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = "vinrouge-${{ matrix.tauri_triple }}.zip"
          Compress-Archive -Path "target\release\vinrouge.exe" -DestinationPath $archive -Force
          Write-Host "CLI archive: $archive"
          Get-Item $archive | Select-Object Name, @{Name="SizeMB";Expression={[math]::Round($_.Length/1MB,1)}}

      - name: Package Windows ZIP
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $stage = "vinrouge-stage"
          New-Item -ItemType Directory -Force -Path $stage
          Copy-Item "vinrouge-desktop\target\release\vinrouge-desktop.exe" "$stage\"
          Copy-Item "vinrouge-desktop\binaries\ollama-${{ matrix.tauri_triple }}.exe" "$stage\ollama.exe"
          if (Test-Path "vinrouge-desktop\binaries\lib") {
            Copy-Item -Recurse "vinrouge-desktop\binaries\lib" "$stage\"
          }
          Compress-Archive -Path "$stage\*" -DestinationPath "VinRouge-windows-x64.zip" -Force
          Write-Host "ZIP size: $([math]::Round((Get-Item VinRouge-windows-x64.zip).Length / 1MB, 1)) MB"

      - name: Build stub installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $iscc     = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version  = (Select-String '^version' vinrouge-desktop\Cargo.toml |
                       Select-Object -First 1).Line -replace '.*"(.*)".*','$1'
          $repo     = "${{ github.server_url }}/${{ github.repository }}"
          $url      = "$repo/releases/download/latest/VinRouge-windows-x64.zip"
          Write-Host "ISCC: $iscc"
          Write-Host "DownloadUrl: $url"
          Write-Host "AppVersion:  $version"
          & $iscc "/DDownloadUrl=$url" "/DAppVersion=$version" "/O." "vinrouge-desktop\installer\stub.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload macOS bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: VinRouge-${{ matrix.platform }}
          path: |
            vinrouge-desktop/target/release/bundle/dmg/*.dmg
            vinrouge-*.tar.gz
          if-no-files-found: warn

      - name: Upload Linux bundle
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: VinRouge-${{ matrix.platform }}
          path: |
            vinrouge-desktop/target/release/bundle/deb/*.deb
            vinrouge-desktop/target/release/bundle/appimage/*.AppImage
            vinrouge-*.tar.gz
          if-no-files-found: warn

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: VinRouge-${{ matrix.platform }}
          path: |
            VinRouge-windows-x64.zip
            VinRouge-*-Setup.exe
            vinrouge-*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            COMMITS=$(git rev-list --count HEAD)
            VERSION="0.1.${COMMITS}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Force-update 'latest' tag (master)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git tag -f latest
          git push origin -f latest

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Latest Build (v{0})', steps.version.outputs.value) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: artifacts/**/*
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
