name: Worker

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-cli:
    name: CLI ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: vinrouge
            asset_name: vinrouge-linux-x86_64
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: vinrouge
            asset_name: vinrouge-macos-x86_64
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-13
            artifact_name: vinrouge
            asset_name: vinrouge-macos-aarch64
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-2022
            artifact_name: vinrouge.exe
            asset_name: vinrouge-windows-x86_64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev headers (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux and macOS)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package archive (Linux and macOS)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/
          cp README.md dist/
          cp LLM_GUIDE.md dist/
          tar -czf ${{ matrix.asset_name }}.tar.gz -C dist .

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.artifact_name }}" dist\
          Copy-Item README.md dist\
          Copy-Item LLM_GUIDE.md dist\
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.asset_name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 1

  build-worker:
    name: Worker ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: vinrouge-worker
            asset_name: vinrouge-worker-linux-x86_64
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-2022
            artifact_name: vinrouge-worker.exe
            asset_name: vinrouge-worker-windows-x86_64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev headers (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-worker

      - name: Build release worker binary
        working-directory: vinrouge-worker
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: strip vinrouge-worker/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package archive (Linux)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          mkdir -p dist
          cp vinrouge-worker/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/
          cp README.md dist/
          cp LLM_GUIDE.md dist/
          tar -czf ${{ matrix.asset_name }}.tar.gz -C dist .

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "vinrouge-worker\target\${{ matrix.target }}\release\${{ matrix.artifact_name }}" dist\
          Copy-Item README.md dist\
          Copy-Item LLM_GUIDE.md dist\
          Compress-Archive -Path dist\* -DestinationPath "${{ matrix.asset_name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Release
    needs: [build-cli, build-worker]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VinRougeData ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          fail_on_unmatched_files: true

      - name: Compute build tag (master)
        if: github.ref == 'refs/heads/master'
        id: build_tag
        run: echo "tag=build-$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create dev build release (master)
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_tag.outputs.tag }}
          name: "Dev build ${{ steps.build_tag.outputs.tag }}"
          prerelease: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body: |
            Automated build from the latest commit on `master`.

            **Commit:** ${{ github.sha }}
            **Run:** #${{ github.run_number }}
