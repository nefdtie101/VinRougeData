<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: #1a1a1a; color: #c0c0c0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }
    .topbar {
      display: flex; align-items: center;
      padding: 12px 16px;
      border-bottom: 0.5px solid #2a2a2a;
      flex-shrink: 0; background: #161616;
    }
    .title { font-size: 15px; font-weight: 600; color: #d4d4d4; margin: 0; }
    .body {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .row { display: flex; flex-direction: column; gap: 4px; }
    label {
      font-size: 11px; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    input, select {
      font-size: 12px; padding: 7px 10px;
      background: #222; color: #d4d4d4;
      border: 0.5px solid #333; border-radius: 4px; outline: none;
    }
    input:focus, select:focus { border-color: #555; }
    .btn-row {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 12px 16px;
      border-top: 0.5px solid #2a2a2a;
      flex-shrink: 0; background: #161616;
    }
    button {
      font-size: 12px; padding: 6px 14px; border-radius: 4px;
      cursor: pointer; border: 0.5px solid #444;
      background: #222; color: #d4d4d4;
    }
    button.primary { background: #8b1a2a; border-color: #8b1a2a; color: #fff; }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; }
    .seg button.active { background: #8b1a2a; border-color: #8b1a2a; color: #fff; }
    .hint { font-size: 10px; color: #666; margin-top: 2px; }
    .saved {
      font-size: 12px; color: #4ade80; margin-right: auto;
      opacity: 0; transition: opacity 0.2s;
    }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="topbar"><h1 class="title">Settings</h1></div>
  <div class="body">
    <div class="row">
      <label>AI Provider</label>
      <div class="seg" id="providerSeg">
        <button data-value="ollama" id="btnOllama">Ollama (Local)</button>
        <button data-value="terminal" id="btnTerminal">Terminal</button>
      </div>
    </div>
    <div class="row" id="ollamaUrlRow">
      <label>Ollama URL</label>
      <input type="text" id="ollamaUrl" placeholder="http://localhost:11434" />
    </div>
    <div class="row" id="ollamaModelRow">
      <label>Ollama Model</label>
      <input type="text" id="ollamaModel" placeholder="mistral" />
    </div>
    <div class="row" id="terminalCommandRow">
      <label>Command</label>
      <input type="text" id="terminalCommand" placeholder="claude" />
      <div class="hint">CLI command to invoke. Leave blank to use `claude` from PATH.</div>
    </div>
  </div>
  <div class="btn-row">
    <span class="saved" id="savedHint">Saved</span>
    <button onclick="doCancel()">Cancel</button>
    <button class="primary" onclick="doSave()">Save</button>
  </div>

  <script>
    function $(id) { return document.getElementById(id); }

    let provider = 'ollama';

    function setProvider(p) {
      provider = p;
      $('btnOllama').classList.toggle('active', p === 'ollama');
      $('btnTerminal').classList.toggle('active', p === 'terminal');
      $('ollamaUrlRow').style.display = p === 'ollama' ? 'flex' : 'none';
      $('ollamaModelRow').style.display = p === 'ollama' ? 'flex' : 'none';
      $('terminalCommandRow').style.display = p === 'terminal' ? 'flex' : 'none';
    }

    $('providerSeg').addEventListener('click', function(e) {
      var b = e.target.closest('button');
      if (b && b.dataset.value) { setProvider(b.dataset.value); }
    });

    async function loadSettings() {
      try {
        var s = await __TAURI__.core.invoke('get_settings');
        setProvider(s.provider || 'ollama');
        $('ollamaUrl').value = s.ollama_url || '';
        $('ollamaModel').value = s.ollama_model || '';
        $('terminalCommand').value = s.terminal_command || '';
      } catch (e) {
        console.error('Failed to load settings:', e);
      }
    }

    async function doSave() {
      var payload = {
        provider: provider,
        ollama_url: $('ollamaUrl').value.trim(),
        ollama_model: $('ollamaModel').value.trim(),
        ollama_models_dir: null,
        terminal_command: $('terminalCommand').value.trim(),
      };
      try {
        await __TAURI__.core.invoke('save_settings', { settings: payload });
        var hint = $('savedHint');
        hint.classList.add('show');
        setTimeout(function() { hint.classList.remove('show'); }, 1200);
        setTimeout(function() { doCancel(); }, 400);
      } catch (e) {
        alert('Failed to save settings: ' + e);
      }
    }

    async function doCancel() {
      try {
        await __TAURI__.core.invoke('close_settings_window');
      } catch (e) {
        console.error('Failed to close settings window:', e);
        window.close();
      }
    }

    loadSettings();
  </script>
</body>
</html>
