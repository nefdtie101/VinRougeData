<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VinRouge — Data Analysis</title>
    <link data-trunk rel="css" href="assets/base.css" />
    <link data-trunk rel="css" href="assets/projects.css" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5/css/xterm.css" />
    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css" />

  <body>
    <!-- Trunk replaces this with the WASM bundle -->
    <script type="module" src="/vinrouge-web.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8/lib/xterm-addon-fit.js"></script>
    <!-- Local bridges (data-trunk so Trunk copies them to dist) -->
    <script data-trunk src="assets/pty-bridge.js"></script>
    <script data-trunk src="assets/charts-bridge.js"></script>
    <script data-trunk src="assets/dsl-editor.js"></script>
    <!-- Settings window page -->
    <link data-trunk rel="copy-file" href="settings.html" />
